<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gui's Photos | Photography by Gui Roque</title>
    <script>
        document.documentElement.classList.add("is-loading");
        window.addEventListener("load", () => {
            window.requestAnimationFrame(() => {
                document.documentElement.classList.remove("is-loading");
                document.documentElement.classList.add("is-ready");
            });
        }, { once: true });
    </script>
    <link rel="stylesheet" href="./styles/global.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="page-shell">
        <section class="hero" aria-labelledby="home-title">
            <div class="hero-copy">
                <p class="eyebrow">Reykjavik portrait photography</p>
                <h1 id="home-title">Gui's Photos</h1>
                <p>Portrait-led photography by Gui Roque, shaped around intimate close-ups, expressive lighting, and visual stories.</p>
                <div class="hero-actions">
                    <a class="button-link primary" href="mailto:eoqrupics@gmail.com">Book a shoot</a>
                    <a class="button-link" href="https://www.instagram.com/guiroquue/" target="_blank" rel="noopener noreferrer">Instagram</a>
                </div>
            </div>
            <img class="hero-image image-fade" src="./assets/images/runway.jpg" alt="Fashion runway photograph by Gui Roque">
        </section>

        <section class="portfolio-section" aria-labelledby="portfolio-title">
            <div class="page-intro">
                <p class="eyebrow">Projects</p>
                <h2 id="portfolio-title">Selected work</h2>
                <p>Recent portraits and visual experiments.</p>
            </div>

            <section id="image-grid" class="gallery-grid" aria-live="polite"></section>
        </section>
    </main>

    <footer>
        <p>Copyright Gui Roque © All rights reserved.</p>
    </footer>

    <script src="./data/gallery.js"></script>
    <script src="./components/site-header.js"></script>
    <script src="./components/work-grid.js"></script>
</body>
</html>
