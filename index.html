<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gui's Photos | Photography by Gui Roque</title>
    <meta name="description" content="Portrait photography portfolio by Gui Roque in Reykjavik, featuring expressive lighting, intimate close-ups, and recent visual work.">
    <meta name="theme-color" content="#f4f4f1">
    <link rel="canonical" href="https://eoqrupics.com/">
    <meta property="og:site_name" content="Gui's Photos">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gui's Photos | Photography by Gui Roque">
    <meta property="og:description" content="Portrait photography portfolio by Gui Roque in Reykjavik.">
    <meta property="og:url" content="https://eoqrupics.com/">
    <meta property="og:image" content="https://eoqrupics.com/assets/images/runway.jpg">
    <meta property="og:image:alt" content="Fashion runway photograph by Gui Roque">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gui's Photos | Photography by Gui Roque">
    <meta name="twitter:description" content="Portrait photography portfolio by Gui Roque in Reykjavik.">
    <meta name="twitter:image" content="https://eoqrupics.com/assets/images/runway.jpg">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
    <link rel="manifest" href="./site.webmanifest">
    <script>
        document.documentElement.classList.add("is-loading");
        window.addEventListener("load", () => {
            window.requestAnimationFrame(() => {
                document.documentElement.classList.remove("is-loading");
                document.documentElement.classList.add("is-ready");
            });
        }, { once: true });
    </script>
    <link rel="stylesheet" href="./styles/global.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="page-shell">
        <section class="hero" aria-labelledby="home-title">
            <div class="hero-copy">
                <p class="eyebrow">Reykjavik portrait photography</p>
                <h1 id="home-title">Gui's Photos</h1>
                <p>Portrait-led photography by Gui Roque, shaped around intimate close-ups, expressive lighting, and visual stories.</p>
                <div class="hero-actions">
                    <a class="button-link primary" href="mailto:eoqrupics@gmail.com">Book a shoot</a>
                    <a class="button-link" href="https://www.instagram.com/guiroquue/" target="_blank" rel="noopener noreferrer">Instagram</a>
                </div>
            </div>
            <img class="hero-image image-fade" src="./assets/images/runway.jpg" alt="Fashion runway photograph by Gui Roque">
        </section>

        <section class="portfolio-section" aria-labelledby="portfolio-title">
            <div class="page-intro">
                <p class="eyebrow">Projects</p>
                <h2 id="portfolio-title">Selected work</h2>
                <p>Recent portraits and visual experiments.</p>
            </div>

            <section id="image-grid" class="gallery-grid" aria-live="polite"></section>
        </section>
    </main>

    <footer>
        <p>Copyright Gui Roque © All rights reserved.</p>
    </footer>

    <script src="./data/gallery.js"></script>
    <script src="./components/site-header.js"></script>
    <script src="./components/work-grid.js"></script>
</body>
</html>
