<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Gui's Photos</title>
    <meta name="description" content="The requested page could not be found on Gui's Photos.">
    <meta name="theme-color" content="#f4f4f1">
    <link rel="canonical" href="https://eoqrupics.com/404.html">
    <meta property="og:site_name" content="Gui's Photos">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Page Not Found | Gui's Photos">
    <meta property="og:description" content="The requested page could not be found on Gui's Photos.">
    <meta property="og:url" content="https://eoqrupics.com/404.html">
    <meta property="og:image" content="https://eoqrupics.com/assets/images/runway.jpg">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
    <link rel="manifest" href="./site.webmanifest">
    <script>
        document.documentElement.classList.add("is-loading");
        window.addEventListener("load", () => {
            window.requestAnimationFrame(() => {
                document.documentElement.classList.remove("is-loading");
                document.documentElement.classList.add("is-ready");
            });
        }, { once: true });
    </script>
    <link rel="stylesheet" href="./styles/global.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="narrow-shell error-shell">
        <section class="error-panel" aria-labelledby="error-title">
            <p class="eyebrow">404</p>
            <h1 id="error-title">Page not found</h1>
            <p>The page may have moved, or the link may be out of date.</p>
            <a class="button-link primary" href="./index.html">Back to projects</a>
        </section>
    </main>

    <footer>
        <p>Copyright Gui Roque © All rights reserved.</p>
    </footer>

    <script src="./components/site-header.js"></script>
</body>
</html>
